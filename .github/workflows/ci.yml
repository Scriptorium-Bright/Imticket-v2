name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 테스트 실행
        run: gradle clean test --no-daemon

      - name: 애플리케이션 빌드
        run: gradle bootJar --no-daemon

      - name: 도커 이미지 빌드 확인
        run: docker build -t imticket-v2:ci .

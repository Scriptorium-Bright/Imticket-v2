services:
  mysql:
    image: mysql:8.4
    container_name: imticket-v2-mysql
    environment:
      MYSQL_DATABASE: imticket
      MYSQL_USER: imticket
      MYSQL_PASSWORD: imticket
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: imticket-v2-app
    environment:
      DB_URL: jdbc:mysql://mysql:3306/imticket?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: imticket
      DB_PASSWORD: imticket
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      JWT_SECRET: ${JWT_SECRET:-imticket-v2-docker-secret-key-change-before-production}
      RESERVATION_EXPIRATION_SCHEDULER_ENABLED: ${RESERVATION_EXPIRATION_SCHEDULER_ENABLED:-true}
      PAYMENT_GATEWAY_PROVIDER: ${PAYMENT_GATEWAY_PROVIDER:-fake}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      PORTONE_API_BASE_URL: ${PORTONE_API_BASE_URL:-https://api.portone.io}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: imticket-v2-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.1.0
    container_name: imticket-v2-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
